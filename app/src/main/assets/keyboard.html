:root{
  --ink-deep:#0d1712;
  --slate:#1b2e24;
  --slate-dark:#17251d;
  --slate-darker:#101c15;
  --gold:#c9a24b;
  --gold-soft:#e2c785;
  --parchment:#f3ecda;
  --ink-text:#2c2a24;
  --leaf-pale:#e4ecd9;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
.key, .grid-key, .math-key, .popup, .popup .opt, .mini-glyph, .archive-btn{ touch-action:none; }
html,body{height:100%;}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(127,160,106,0.14), transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(201,162,75,0.12), transparent 55%),
    var(--ink-deep);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  padding: 24px 12px; user-select:none;
}

.scene{ display:flex; flex-direction:column; align-items:center; gap:16px; }
.eyebrow{ color: var(--gold-soft); font-size:12.5px; letter-spacing:0.14em; text-transform:uppercase; font-weight:600; opacity:0.85; text-align:center; }
.eyebrow span{ color:rgba(243,236,218,0.55); font-weight:500; }

.phone{
  width:360px; background:#000; border-radius:38px; padding:12px; box-shadow:0 30px 60px rgba(0,0,0,0.6);
}
.screen{
  width:100%; background: var(--parchment); border-radius:28px; overflow:hidden;
  height:800px; display:flex; flex-direction:column; position:relative; box-shadow: 0 0 0 1px rgba(0,0,0,0.35) inset;
}
.notch{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:18px; background:#000; border-radius:0 0 14px 14px; z-index:20; }
.statusbar{ height:34px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:11px; color: var(--ink-text); opacity:0.8; }
.appbar{ flex-shrink:0; padding: 0 20px 8px; border-bottom: 1px solid rgba(44,42,36,0.12); }
.appbar .app-title{ font-family: Georgia, serif; font-style:italic; font-size:19px; color: var(--ink-text); }
.appbar .app-sub{ font-size:10.5px; color:rgba(44,42,36,0.55); margin-top:2px; }

.editor{ flex:1; padding:14px 20px; overflow-y:auto; min-height:0; }
.editor .typed{ font-size:24px; line-height:1.7; color: var(--ink-text); word-break:break-word; white-space:pre-wrap; }
.editor .typed .run-tengwar{ font-family:'TengwarAnnatar', serif; }
.editor .typed .run-plain{ font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
.editor .typed .word-unit{ cursor:pointer; border-radius:3px; padding:0 1px; }
.editor .typed .word-unit.selected-word{ background: rgba(201,162,75,0.45); }
.caret{ display:inline-block; width:2px; height:20px; background: var(--slate); vertical-align:-4px; animation: blink 1s step-start infinite; margin-left:1px; }
@keyframes blink{ 50%{ opacity:0; } }

.kbd-wrap{ flex-shrink:0; background: var(--slate); padding:6px 3px 9px; border-top: 1px solid rgba(201,162,75,0.25); position:relative; }
.kbd-header{ display:flex; align-items:center; justify-content:space-between; gap:6px; padding:2px 4px 7px; }
.kbd-header .title-group{ display:flex; align-items:center; gap:6px; }
.kbd-header svg{ width:30px; height:16px; opacity:0.8; }
.kbd-header span{ font-family: Georgia, serif; font-style:normal; font-size:11px; letter-spacing:0.03em; color: var(--gold-soft); }
.archive-btn{
  font-family: Georgia, 'Times New Roman', serif; font-size:11px; font-weight:700; font-style:normal;
  color:#2c2a24; background: var(--gold);
  border:none; border-radius:5px; padding:4px 9px; cursor:pointer; letter-spacing:0.01em;
}
.archive-btn.pressed{ background: var(--gold-soft); transform: scale(0.95); }
.archive-btn.added-flash{ background:#3f7a53; color:#fff; }

.page{ display:none; }
.page.active{ display:block; }

.row{ display:flex; gap:3px; margin-bottom:3px; justify-content:center; }
.row.control-row{ max-width:354px; margin-left:auto; margin-right:auto; }
.row:last-child{ margin-bottom:0; }
.kbd-divider{ height:1px; background:linear-gradient(90deg, transparent, rgba(201,162,75,0.55), transparent); margin:2px 0 7px; }

.lp-confirm-overlay{
  position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
  background:rgba(10,16,12,0.85);
}
.lp-confirm-overlay.open{ display:flex; }
.lp-confirm-box{
  background:var(--slate-dark); border:1px solid rgba(201,162,75,0.4); border-radius:14px;
  padding:18px 20px; width:80%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
.lp-confirm-box p{ margin:0 0 14px; color:var(--parchment); font-size:13px; line-height:1.5; }
.lp-confirm-actions{ display:flex; gap:10px; justify-content:center; }
.lp-confirm-yes, .lp-confirm-no{
  border:none; border-radius:8px; padding:8px 18px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit;
}
.lp-confirm-yes{ background:var(--gold); color:#2c2a24; }
.lp-confirm-no{ background:transparent; color:var(--gold-soft); border:1.5px solid rgba(201,162,75,0.5); }

.key{
  flex:1; min-width:0; height:44px; background:#ffffff; border-radius:8px; border:none;
  box-shadow:0 2px 0 rgba(0,0,0,0.18); position:relative; padding:0; cursor:pointer;
  transition: transform .08s ease, box-shadow .08s ease, background .08s ease;
}
.key.mini{ height:26px; }
.key.mini .tag{ display:none; }
.key.mini.labeled-mini{
  display:flex; align-items:center; justify-content:center; gap:5px; padding:0 6px;
  flex:1 1 0 !important; width:auto !important; min-width:0 !important;
}
.key.mini.labeled-mini .mini-label{
  font-size:8px; font-weight:600; color:rgba(228,236,217,0.8); text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.key.mini.labeled-mini .mini-glyph{
  font-family:'TengwarAnnatar', serif; font-size:20px; color:var(--leaf-pale);
  line-height:1; display:inline-block; flex-shrink:0;
}
.key.empty{ background:rgba(255,255,255,0.10); box-shadow:none; cursor:default; }
.key.pressed{ transform: translateY(2px) scale(0.94); box-shadow:0 0 0 rgba(0,0,0,0.18); background: var(--gold-soft); }
.key.mini.labeled-mini.pressed .mini-label{ color:#2c2a24; }
.key.mini.labeled-mini.pressed .mini-glyph{ color:#2c2a24; }
.key.letter{ background: var(--slate-dark); }
.key.letter.tail-relocated{ flex:1.4; }
.key.letter .glyph{ color: var(--leaf-pale); }
.key.letter.pressed{ background: var(--gold-soft); }
.key.letter.pressed .glyph{ color:#1c1f28; }
.key .glyph{
  font-family:'TengwarAnnatar', serif; font-size:18px; color:#1c1f28; line-height:1; pointer-events:none;
  position:absolute; top:50%; left:50%;
}
.key .glyph.big{ font-size:24px; }
.key .glyph.plain{ font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size:16px; font-weight:600; }
.key.special .glyph{ color: var(--leaf-pale); }
.key .tag{
  position:absolute; bottom:2px; right:3px; font-size:9px; color:rgba(20,22,28,0.82);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-weight:700; letter-spacing:0.01em; max-width:88%; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; pointer-events:none;
}
.key.letter .tag{ color:rgba(230,238,220,0.85); }
.key .tag.topnum{
  bottom:auto; top:3px; right:auto; left:50%; transform:translateX(-50%);
  font-size:10px; color:rgba(28,31,40,0.55);
}
.key.letter .tag.topnum{ color:rgba(228,236,217,0.85); }
.key .tag.topright{ bottom:auto; top:2px; right:3px; }
.key .tag.telco-label{
  bottom:auto; top:4px; right:auto; left:50%; transform:translateX(-50%) scale(1);
  font-size:5.6px; letter-spacing:0; color:rgba(28,31,40,0.55); max-width:100%; overflow:visible;
}
.key.letter .tag.telco-label{ color:rgba(228,236,217,0.7); }

.key.special{ background: var(--slate-dark); color:#fff; flex:1.4; box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
.key.special.enter{ flex:1.9; }
.key.special.caps-active{ background: var(--gold); color:#2c2a24; }
.key.special .label-txt{ font-size:15px; font-weight:600; color:var(--leaf-pale); pointer-events:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); white-space:nowrap; display:flex; align-items:center; justify-content:center; }
.key.special .label-txt svg{ width:20px; height:20px; pointer-events:none; }
.key.special.enter .label-txt svg{ width:24px; height:24px; }
.key.special.space{ position:relative; }
.space-arrow{
  position:absolute; top:50%; transform:translateY(-50%); font-size:13px;
  color:rgba(228,236,217,0.4); pointer-events:none; font-weight:700;
}
.space-arrow.left{ left:8px; }
.space-arrow.right{ right:8px; }
#abcBtn .label-txt, #backBtn3 .label-txt, #trAbcBtn .label-txt, #trEmojiBackBtn .label-txt{ font-size:12px; }
.key.special.pressed{ background: var(--slate-darker); transform: translateY(2px) scale(0.96); }
.key.special.space{ flex:5.2; }
.key.special.space .label-txt{ font-size:13px; letter-spacing:0.03em; font-weight:600; color:rgba(228,236,217,0.75); }
.key.special.space .label-txt.tengwar-space{
  font-family:'TengwarAnnatar', serif; font-style:normal; font-size:13px; font-weight:400;
  letter-spacing:0; color:rgba(228,236,217,0.85); max-width:82%; overflow:hidden; text-overflow:clip;
  white-space:nowrap;
}
.key.special.comma{ flex:1.15; }
#engCommaBtn .label-txt, #engPeriodBtn .label-txt,
#trSymCommaBtn .label-txt, #trSymPeriodBtn .label-txt,
#trEmojiCommaBtn .label-txt, #trEmojiPeriodBtn .label-txt{ font-size:24px; transform:translate(-50%,-58%); }
.key.special.quick-text .label-txt{ font-size:13px; letter-spacing:0; }

.popup{

.popup .opt{ width:38px; height:42px; background:#1f3527; border-radius:7px; border:none; position:relative; cursor:pointer; }

.popup .opt .glyph{ font-family:'TengwarAnnatar', serif; font-size:20px; color:var(--leaf-pale); pointer-events:none; position:absolute; top:50%; left:50%; }
.popup .opt .glyph.big{ font-size:23px; }
.popup .opt .glyph.plain-popup-glyph{
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size:17px; font-weight:600;
}
.popup .opt .opt-num{
  position:absolute; font-size:9px; font-weight:700; color: var(--gold-soft); pointer-events:none;
}
.popup .opt .opt-num.pos-bottom{ bottom:2px; left:50%; transform:translateX(-50%); }
.popup .opt .opt-num.pos-bottom-right{ bottom:2px; right:3px; }
.popup .opt .opt-num.pos-top{ top:2px; left:50%; transform:translateX(-50%); }
.popup .opt .opt-label{
  position:absolute; top:2px; left:50%; transform:translateX(-50%);
  font-size:7.5px; font-weight:600; color: var(--gold-soft); pointer-events:none; white-space:nowrap;
}
.popup .opt.pressed{ background: var(--gold); }
.popup .opt.pressed .glyph{ color:#2c2a24; }

/* ---------------- Emoji / noktalama paneli ---------------- */
.cat-tabs{ display:flex; gap:4px; margin-bottom:6px; }
.cat-tab{
  flex:1; height:32px; background: var(--slate-dark); border:none; border-radius:7px;
  display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; color:#fff;

/* ---------------- Kaydırma çubukları (arayüz temasına uygun) ---------------- */
*{ scrollbar-width: thin; scrollbar-color: var(--gold) #14231a; }

.grid{
  display:grid; grid-template-columns: repeat(8, 1fr); gap:4px;
  height:150px; overflow-y:auto; padding:2px; align-content:start;
}
.grid.autofit{ height:auto; overflow:visible; grid-template-columns: repeat(10, 1fr); }
.punct-row{ display:flex; align-items:flex-start; gap:6px; }
.punct-row .grid.autofit{ flex:1; }
.grid-key.plain-key{
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size:15px; font-weight:600; color:#1c1f28;
}
.math-box{
  flex-shrink:0; display:grid; grid-template-columns: repeat(2, 1fr); gap:4px;
  width:80px; align-content:start;
}
.math-key{
  height:38px; background: var(--slate-dark); border:none; border-radius:7px;
  color: var(--leaf-pale); font-size:17px; font-weight:600; cursor:pointer;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  display:flex; align-items:center; justify-content:center; position:relative;
  transition: transform .08s ease, background .08s ease;
}
.math-key.pressed{ background: var(--gold); color:#2c2a24; transform: scale(0.9); }
.grid-key{
  height:38px; background:rgba(255,255,255,0.94); border-radius:7px; border:none;
  display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; position:relative;
}
.grid-key.tengwar{ font-size:22px; color:#1c1f28; }
.grid-key.tengwar .glyph{

  position:absolute; top:50%; left:50%;
}
.grid-key.pressed{ background: var(--gold-soft); transform: scale(0.9); }
.grid-key.archive-word-key{
  background: var(--slate-dark); width:auto; padding:0 12px; flex:0 0 auto;
  transition: transform .05s ease;
}
.grid-key.archive-word-key.pressed{ background: var(--gold); }
.grid-key.archive-word-key.dragging-word{ opacity:0.85; z-index:60; box-shadow:0 6px 14px rgba(0,0,0,0.4); }
.grid-key.archive-word-key.drop-target-hover{ background: var(--gold); outline:2px solid var(--gold-soft); }
.grid-key.archive-word-key.drop-target-hover span{ color:#2c2a24 !important; }
#archiveGrid{

}
.popup .opt.action-opt{ width:auto; padding:0 12px; height:34px; }
.popup .opt.text-opt{ width:auto; padding:0 10px; white-space:nowrap; }
.popup .opt.action-opt span{ font-size:9.5px; font-weight:700; color:var(--leaf-pale); white-space:nowrap; }
.panel-bottom{ display:flex; gap:5px; margin-top:6px; max-width:354px; margin-left:auto; margin-right:auto; }

function makePlainGlyphSpan(ch){
  const span = document.createElement('span');
  span.className = 'glyph plain-popup-glyph';
  span.textContent = ch;
  span.style.transform = 'translate(-50%, -50%)';
  return span;
}

function makeGlyphSpan(glyphStr, big, topAlign, topPx, extraDy){
  const span = document.createElement('span');
  span.className = 'glyph' + (big ? ' big' : '');
  span.textContent = glyphStr;
  const off = GLYPH_OFFSETS[glyphStr] || [0, 0];
  const dy = off[1] + (extraDy || 0);
  if(topAlign){
    span.style.top = (topPx || 9) + 'px';
    span.style.transform = `translateX(-50%) translateX(${off[0]}em)`;
  } else {
    span.style.transform = `translate(-50%, -50%) translate(${off[0]}em, ${dy}em)`;
  }
  return span;
}

// Android WebView içine gömülüyse (gerçek klavye), window.AndroidKeyboard köprüsü üzerinden
// hedef uygulamaya yazıyoruz. Tarayıcı önizlemesinde bu köprü yok, yerel sahte editöre yazıyoruz.
const HAS_ANDROID = (typeof AndroidKeyboard !== 'undefined');

let typedChars = []; // { ch, plain } dizisi — sadece önizlemede kullanılıyor
let selectedWordId = null;
const typedEl = document.getElementById('typed');
const editorEl = document.getElementById('editor');
const kbdWrap = document.getElementById('kbdWrap');

function renderTyped(){
  if(!typedEl) return; // üretim (gerçek klavye) sürümünde sahte editör yok
  typedEl.innerHTML = '';
  let wordChars = [];
  let wordCounter = 0;

  function flushWord(){
    if(wordChars.length === 0) return;
    const wordSpan = document.createElement('span');
    const myId = 'w' + (wordCounter++);
    wordSpan.className = 'word-unit' + (selectedWordId === myId ? ' selected-word' : '');
    let i = 0;
    while(i < wordChars.length){
      const plain = wordChars[i].plain;
      let buf = ''; let j = i;
      while(j < wordChars.length && wordChars[j].plain === plain){ buf += wordChars[j].ch; j++; }
      const runSpan = document.createElement('span');
      runSpan.className = plain ? 'run-plain' : 'run-tengwar';
      runSpan.textContent = buf;
      wordSpan.appendChild(runSpan);
      i = j;
    }
    const chars = wordChars.slice();
    wordSpan.addEventListener('click', () => {
      selectedWordId = (selectedWordId === myId) ? null : myId;
      selectedWordChars = selectedWordId ? chars : null;
      renderTyped();
    });
    typedEl.appendChild(wordSpan);
    wordChars = [];
  }

  for(const c of typedChars){
    if(c.ch === ' ' || c.ch === '\n'){
      flushWord();
      typedEl.appendChild(document.createTextNode(c.ch));
    } else {
      wordChars.push(c);
    }
  }
  flushWord();
  if(editorEl) editorEl.scrollTop = editorEl.scrollHeight;
}

function commit(str, plain){
  if(HAS_ANDROID){
    AndroidKeyboard.commitText(str, !!plain);
  }
  if(typedEl){
    for(const ch of str) typedChars.push({ ch, plain: !!plain });
    renderTyped();
  }
}
function backspace(){
  if(HAS_ANDROID){
    AndroidKeyboard.deleteBackward();
  }
  if(typedEl){
    typedChars.pop();
    renderTyped();
  }
}

const ARCHIVE_LIMIT = 20;

function saveSelectedToArchive(){
  if(HAS_ANDROID){
    AndroidKeyboard.saveSelectedToArchive();
    return null; // sonuç asenkron olarak window.onArchiveSaveResult ile gelecek
  }
  if(!selectedWordChars || selectedWordChars.length === 0) return false;
  const text = selectedWordChars.map(c => c.ch).join('');
  if(archiveWords.some(w => w.text === text)) return false;
  archiveWords.push({ chars: selectedWordChars.slice(), text });
  if(archiveWords.length > ARCHIVE_LIMIT) archiveWords.shift();
  return true;
}

function handleArchiveSaveResult(saved){
  if(saved){
    const btn = document.getElementById('archiveOpenBtn');
    const originalText = btn.textContent;
    btn.textContent = 'EKLENDİ';
    btn.classList.add('added-flash');
    setTimeout(() => {
      btn.textContent = originalText;
      btn.classList.remove('added-flash');
    }, 900);
  } else {
    showPage(pageArchive);
  }
}
window.onArchiveSaveResult = handleArchiveSaveResult;

let currentArchiveWords = []; // en son render edilen liste (eylemler bunun üzerinde çalışır)

function persistLocalArchiveOrder(){
  if(!HAS_ANDROID){
    archiveWords = currentArchiveWords;
    return;
  }
  if(typeof AndroidKeyboard.saveArchiveOrder === 'function'){
    const order = currentArchiveWords.map(w => w.text);
    AndroidKeyboard.saveArchiveOrder(JSON.stringify(order));
  }
}

function renderArchiveGrid(){
  const gridEl = document.getElementById('archiveGrid');
  gridEl.innerHTML = '';

  let words;
  if(HAS_ANDROID){
    let raw = [];
    try { raw = JSON.parse(AndroidKeyboard.getArchiveWordsJson()) || []; } catch(e){ raw = []; }
    words = raw.map(text => ({ chars: [...text].map(ch => ({ ch, plain:false })), text }));
  } else {
    words = archiveWords;
  }
  currentArchiveWords = words;

  if(words.length === 0){
    const empty = document.createElement('div');
    empty.style.cssText = 'width:100%; color:rgba(228,236,217,0.55); font-size:11px; text-align:center; padding:20px 8px; line-height:1.6;';
    empty.innerHTML = 'Henüz bir kaydınız yok.<br>Yazı alanındaki bir sözcüğü seçin ve ARŞİV düğmesine tıklayın.';
    gridEl.appendChild(empty);
    return;
  }
  words.forEach(w => {
    const btn = document.createElement('button');
    btn.className = 'grid-key tengwar archive-word-key';
    btn._wordObj = w;
    w.chars.forEach(c => {
      const span = document.createElement('span');
      span.className = c.plain ? 'run-plain' : '';
      if(c.plain){ span.style.fontFamily = "system-ui, sans-serif"; span.style.fontSize = '11px'; span.style.color = '#e4ecd9'; }
      else { span.style.fontFamily = "'TengwarAnnatar', serif"; span.style.fontSize = '15px'; span.style.color = '#e4ecd9'; }
      span.textContent = c.ch;
      btn.appendChild(span);
    });
    attachArchiveWordBehavior(btn, w);
    gridEl.appendChild(btn);
  });
}

/* ---------- Arşiv kelime düğmesi: kısa dokun=yaz, basılı tut=kopyala/sil, tut+sürükle=sırala ---------- */
function attachArchiveWordBehavior(btn, wordObj){
  let timer = null, mode = null; // 'pending' | 'popup' | 'dragging'
  let startX = 0, startY = 0;
  let dragTarget = null;
  const DRAG_THRESHOLD = 10;

  function findDropTarget(x, y){
    const siblings = [...document.getElementById('archiveGrid').querySelectorAll('.archive-word-key')].filter(el => el !== btn);
    for(const el of siblings){
      const r = el.getBoundingClientRect();
      if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return el;
    }
    return null;
  }

  function setDragTarget(el){
    if(el === dragTarget) return;
    if(dragTarget) dragTarget.classList.remove('drop-target-hover');
    dragTarget = el;
    if(dragTarget) dragTarget.classList.add('drop-target-hover');
  }

  function onMove(e){
    if(mode === 'pending'){
      if(Math.abs(e.clientX - startX) > DRAG_THRESHOLD || Math.abs(e.clientY - startY) > DRAG_THRESHOLD){
        clearTimeout(timer);
        mode = 'dragging';
        btn.classList.remove('pressed');
        btn.classList.add('dragging-word');
      }
    }
    if(mode === 'dragging'){
      btn.style.transform = `translate(${e.clientX - startX}px, ${e.clientY - startY}px)`;
      setDragTarget(findDropTarget(e.clientX, e.clientY));
    }
  }
  function finishDrag(e){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
    clearTimeout(timer);
    btn.classList.remove('pressed');
    if(mode === 'dragging'){
      btn.classList.remove('dragging-word');
      btn.style.transform = '';
      setDragTarget(null);
      const targetEl = findDropTarget(e.clientX, e.clientY);
      const targetWordObj = targetEl ? targetEl._wordObj : null;
      const fromIdx = currentArchiveWords.indexOf(wordObj);
      const targetIdx = targetWordObj ? currentArchiveWords.indexOf(targetWordObj) : -1;
      if(fromIdx !== -1 && targetIdx !== -1 && fromIdx !== targetIdx){
        currentArchiveWords[targetIdx] = wordObj;
        currentArchiveWords[fromIdx] = targetWordObj;
        persistLocalArchiveOrder();
        renderArchiveGrid();
      }
    } else if(mode === 'pending'){
      wordObj.chars.forEach(c => commit(c.ch, c.plain));
    }
    mode = null;
  }
  function onUp(e){ finishDrag(e); }
  function onCancel(e){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
    clearTimeout(timer);
    setDragTarget(null);
    btn.classList.remove('pressed', 'dragging-word');
    btn.style.transform = '';
    mode = null;
  }

  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    startX = e.clientX; startY = e.clientY;
    mode = 'pending';
    btn.classList.add('pressed');
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onCancel);
    timer = setTimeout(() => {
      if(mode === 'pending'){
        mode = 'popup';
        btn.classList.remove('pressed');
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancel);
        showArchiveActionPopup(btn, wordObj);
      }
    }, 380);
  });
}

function showArchiveActionPopup(keyEl, wordObj){
  closePopup();
  const popup = document.createElement('div');
  popup.className = 'popup';
  const actions = [
    { label: 'KOPYALA', action: 'copy' },
    { label: 'SİL', action: 'delete' }
  ];
  const optButtons = [];
  actions.forEach(a => {
    const opt = document.createElement('button');
    opt.className = 'opt action-opt';
    const span = document.createElement('span');
    span.textContent = a.label;
    opt.appendChild(span);
    popup.appendChild(opt);
    optButtons.push({ el: opt, action: a.action });
  });
  kbdWrap.appendChild(popup);
  const keyRect = keyEl.getBoundingClientRect();
  const wrapRect = kbdWrap.getBoundingClientRect();
  popup.style.left = '0px'; popup.style.top = '0px';
  const popupWidth = popup.offsetWidth;
  let left = (keyRect.left - wrapRect.left) + keyRect.width/2 - popupWidth/2;
  left = Math.max(4, Math.min(left, wrapRect.width - popupWidth - 4));
  let top = (keyRect.top - wrapRect.top) - popup.offsetHeight - 6;
  if(top < 4){
    // Üstte yeterli alan yok (klavye alanının üst sınırına yapışık) — tuşun altına aç
    top = (keyRect.bottom - wrapRect.top) + 6;
  }
  popup.style.left = left + 'px'; popup.style.top = top + 'px';
  activePopup = popup;

  let hovered = null;
  function updateHover(x, y){
    let found = null;
    for(const o of optButtons){
      const r = o.el.getBoundingClientRect();
      if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom){ found = o; break; }
    }
    if(found !== hovered){
      if(hovered) hovered.el.classList.remove('pressed');
      if(found) found.el.classList.add('pressed');
      hovered = found;
    }
  }
  function copyTextToClipboard(text){
  if(HAS_ANDROID && typeof AndroidKeyboard.copyToClipboard === 'function'){
    AndroidKeyboard.copyToClipboard(text);
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(() => { legacyCopyFallback(text); });
  } else {
    legacyCopyFallback(text);
  }
}
function legacyCopyFallback(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); } catch(e){ /* sessizce yut */ }
  document.body.removeChild(ta);
}

function onMove(e){ updateHover(e.clientX, e.clientY); }
  function onUp(e){
    updateHover(e.clientX, e.clientY);
    if(hovered){
      const text = wordObj.chars.map(c => c.ch).join('');
      if(hovered.action === 'copy'){
        copyTextToClipboard(text);
      } else if(hovered.action === 'delete'){
        const idx = currentArchiveWords.indexOf(wordObj);
        if(idx >= 0) currentArchiveWords.splice(idx, 1);
        if(HAS_ANDROID && typeof AndroidKeyboard.deleteArchiveWord === 'function'){
          AndroidKeyboard.deleteArchiveWord(text);
        } else {
          persistLocalArchiveOrder();
        }
        renderArchiveGrid();
      }
    }
    closePopup();
  }
  function onCancel(){ closePopup(); }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onCancel);
  activePopupCleanup = () => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
  };
}

/* ---------- Uzun basma / kısa dokunma ---------- */
let activePopup = null;
let activePopupCleanup = null;
function closePopup(){
  if(activePopupCleanup){ activePopupCleanup(); activePopupCleanup = null; }
  if(activePopup){ activePopup.remove(); activePopup = null; }
}
document.addEventListener('pointerdown', (e) => {
  if(activePopup && !activePopup.contains(e.target)) closePopup();
});

function altVariantsFor(cell){
  if(cell.extraAlts){
    return cell.extraAlts.map(a => {
      if(typeof a === 'string') return { glyph: a, outputGlyph: a, label: '', plain: !!cell.plain };
      return { glyph: a.display, outputGlyph: a.output, label: '', plain: !!a.plain, wide: !!a.wide };
    });
  }
  const seen = new Set([cell.standard.glyph]);
  const out = [];
  for(const m of ['shift','altgr','shiftAltgr']){
    const v = cell[m];
    if(v.glyph && !seen.has(v.glyph)){ seen.add(v.glyph); out.push({ glyph: v.glyph, outputGlyph: v.glyph, label: v.label, plain: false }); }
  }
  return out;
}

function showPopup(keyEl, cell){
  closePopup();
  const alts = altVariantsFor(cell);
  if(alts.length === 0) return;
  const isVowelKey = VOWEL_LABELS.has(cell.standard.label);
  const isTailKey = cell.standard.glyph === 'ü';
  const isTelcoKey = cell.standard.glyph === '`';
  const isTireKey = cell === tireCell;
  const isCiftlemeKey = cell === ciftlemeCell;
  const isPeriodKey = cell === periodCell;
  const isCommaKey = cell === commaCell;
  const isPlainPopupKey = !!cell.plain;
  const isCurated = isVowelKey || isTailKey || isTireKey || isCiftlemeKey || isPeriodKey || isCommaKey || isPlainPopupKey;
  let numPosClass = 'pos-bottom';
  if(cell.standard.label === 'İ' || cell.standard.label === 'Ö') numPosClass = 'pos-bottom-right';
  if(isTailKey || isTireKey || isPeriodKey || isCiftlemeKey || isCommaKey || isPlainPopupKey) numPosClass = 'pos-top';

  const popup = document.createElement('div');
  popup.className = 'popup';
  const optButtons = [];
  alts.forEach((variant, i) => {
    const opt = document.createElement('button');
    opt.className = 'opt' + (isCurated ? ' vowel-alt' : '') + (variant.wide ? ' opt-wide' : '');
    if(variant.wide){
      const span = document.createElement('span');
      span.className = 'glyph wide-combo';
      span.style.transform = 'translate(-50%, -50%)';
      const parts = variant.glyph.split(' ');
      const p1 = document.createElement('span');
      p1.className = 'wide-combo-part';
      p1.textContent = parts[0];
      const sep = document.createElement('span');
      sep.className = 'wide-combo-sep';
      sep.textContent = ' ';
      const p2 = document.createElement('span');
      p2.className = 'wide-combo-part';
      p2.textContent = parts[1];
      span.appendChild(p1); span.appendChild(sep); span.appendChild(p2);
      opt.appendChild(span);
    } else if(variant.plain){
      opt.appendChild(makePlainGlyphSpan(variant.glyph));
    } else {
      opt.appendChild(makeGlyphSpan(variant.glyph, isCurated, isCurated, 6));
    }
    if(isCurated){
      const num = document.createElement('span');
      num.className = 'opt-num ' + numPosClass;
      num.textContent = (isPeriodKey && i === 1) ? '2*' : String(i + 1);
      opt.appendChild(num);
    } else if(isTelcoKey){
      const lbl = document.createElement('span');
      lbl.className = 'opt-label';
      lbl.textContent = 'ÁRA';
      opt.appendChild(lbl);
    }
    popup.appendChild(opt);
    optButtons.push({ el: opt, glyph: variant.outputGlyph, plain: variant.plain });
  });
  kbdWrap.appendChild(popup);
  const keyRect = keyEl.getBoundingClientRect();
  const wrapRect = kbdWrap.getBoundingClientRect();
  popup.style.left = '0px'; popup.style.top = '0px';
  const popupWidth = popup.offsetWidth;
  let left = (keyRect.left - wrapRect.left) + keyRect.width/2 - popupWidth/2;
  left = Math.max(4, Math.min(left, wrapRect.width - popupWidth - 4));
  let top = (keyRect.top - wrapRect.top) - popup.offsetHeight - 6;
  if(top < 4){
    // Üstte yeterli alan yok (klavye alanının üst sınırına yapışık) — tuşun altına aç
    top = (keyRect.bottom - wrapRect.top) + 6;
  }
  popup.style.left = left + 'px'; popup.style.top = top + 'px';
  activePopup = popup;

  // Parmağı/fareyi seçenekler üzerinde gezdirince o seçeneği vurgula (hover animasyonu)
  let hovered = null;
  function updateHover(x, y){
    let found = null;
    for(const o of optButtons){
      const r = o.el.getBoundingClientRect();
      if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom){ found = o; break; }
    }
    if(found !== hovered){
      if(hovered) hovered.el.classList.remove('pressed');
      if(found) found.el.classList.add('pressed');
      hovered = found;
    }
  }
  function onMove(e){ updateHover(e.clientX, e.clientY); }
  function onUp(e){
    updateHover(e.clientX, e.clientY);
    if(hovered) commit(hovered.glyph, hovered.plain);
    closePopup();
  }
  function onCancel(e){ closePopup(); }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onCancel);
  activePopupCleanup = () => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
  };
}

function attachGlyphKey(el, cell){
  let timer = null, longPressed = false;
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); longPressed = false; el.classList.add('pressed');
    timer = setTimeout(() => { longPressed = true; showPopup(el, cell); }, 380);
  });
  const finish = () => { clearTimeout(timer); el.classList.remove('pressed'); };
  el.addEventListener('pointerup', () => { finish(); if(!longPressed) commit(cell.standard.glyph); });
  el.addEventListener('pointerleave', finish);
  el.addEventListener('pointercancel', finish);
}

function attachPlainGlyphKey(el, cell){
  let timer = null, longPressed = false;
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); longPressed = false; el.classList.add('pressed');
    timer = setTimeout(() => { longPressed = true; showPopup(el, cell); }, 380);
  });
  const finish = () => { clearTimeout(timer); el.classList.remove('pressed'); };
  el.addEventListener('pointerup', () => { finish(); if(!longPressed) commit(cell.standard.glyph, true); });
  el.addEventListener('pointerleave', finish);
  el.addEventListener('pointercancel', finish);
}

function attachTap(el, onTap){
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.classList.add('pressed'); });
  const finish = () => el.classList.remove('pressed');
  el.addEventListener('pointerup', () => { finish(); onTap(); });
  el.addEventListener('pointerleave', finish);
  el.addEventListener('pointercancel', finish);
}

/* ---------- Genel amaçlı özel popup sistemi (Tengwar cell yapısına bağlı olmayan basit alternatifler için) ---------- */
function showCustomPopup(keyEl, options, opts){
  opts = opts || {};
  closePopup();
  const popup = document.createElement('div');
  popup.className = 'popup';
  const optButtons = [];
  options.forEach((o, i) => {
    const optEl = document.createElement('button');
    optEl.className = 'opt text-opt' + (opts.numbered ? ' vowel-alt' : '');
    const span = document.createElement('span');
    span.textContent = o.display;
    span.style.fontFamily = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
    span.style.fontSize = opts.fontSize || '16px';
    span.style.fontWeight = '700';
    span.style.color = 'var(--leaf-pale)';
    optEl.appendChild(span);
    if(opts.numbered){
      const num = document.createElement('span');
      num.className = 'opt-num pos-top';
      num.textContent = String(i + 1);
      optEl.appendChild(num);
    }
    popup.appendChild(optEl);
    optButtons.push({ el: optEl, output: o.output });
  });
  kbdWrap.appendChild(popup);
  const keyRect = keyEl.getBoundingClientRect();
  const wrapRect = kbdWrap.getBoundingClientRect();
  popup.style.left = '0px'; popup.style.top = '0px';
  const popupWidth = popup.offsetWidth;
  let left = (keyRect.left - wrapRect.left) + keyRect.width/2 - popupWidth/2;
  left = Math.max(4, Math.min(left, wrapRect.width - popupWidth - 4));
  let top;
  if(opts.forceBelow){
    top = (keyRect.bottom - wrapRect.top) + 6;
  } else {
    top = (keyRect.top - wrapRect.top) - popup.offsetHeight - 6;
    if(top < 4) top = (keyRect.bottom - wrapRect.top) + 6;
  }
  popup.style.left = left + 'px'; popup.style.top = top + 'px';
  activePopup = popup;

  let hovered = null;
  function updateHover(x, y){
    let found = null;
    for(const o of optButtons){
      const r = o.el.getBoundingClientRect();
      if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom){ found = o; break; }
    }
    if(found !== hovered){
      if(hovered) hovered.el.classList.remove('pressed');
      if(found) found.el.classList.add('pressed');
      hovered = found;
    }
  }
  function onMove(e){ updateHover(e.clientX, e.clientY); }
  function onUp(e){
    updateHover(e.clientX, e.clientY);
    if(hovered) commit(hovered.output, true);
    closePopup();
  }
  function onCancel(){ closePopup(); }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onCancel);
  activePopupCleanup = () => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
  };
}

function attachCustomPopupKey(btn, getOptions, tapOutput, opts){
  let timer = null, longPressed = false;
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault(); longPressed = false; btn.classList.add('pressed');
    timer = setTimeout(() => { longPressed = true; showCustomPopup(btn, getOptions(), opts); }, 380);
  });
  const finish = () => { clearTimeout(timer); btn.classList.remove('pressed'); };
  btn.addEventListener('pointerup', () => {
    finish();
    if(!longPressed){
      const out = typeof tapOutput === 'function' ? tapOutput() : tapOutput;
      commit(out, true);
    }
  });
  btn.addEventListener('pointerleave', finish);
  btn.addEventListener('pointercancel', finish);
}

function makeKey(cell, letterStyle){
  const btn = document.createElement('button');
  const hasGlyph = !!cell.standard.glyph;
  btn.className = 'key' + (hasGlyph ? '' : ' empty') + (letterStyle ? ' letter' : '');
  if(!hasGlyph) return btn;
  const isVowel = VOWEL_LABELS.has(cell.standard.label);
  const isTopVowel = VOWEL_TOP_LABELS.has(cell.standard.label);
  const isDigit = /^[0-9]$/.test(cell.standard.label || '');
  btn.appendChild(makeGlyphSpan(cell.standard.glyph, isVowel, isTopVowel, undefined, isDigit ? 0.13 : 0));
  if(cell.standard.glyph === '`'){
    const telco = document.createElement('span');
    telco.className = 'tag telco-label';
    telco.textContent = 'TELCO';
    btn.appendChild(telco);
  } else if(cell.standard.label){
    const tag = document.createElement('span');
    let tagClass = 'tag';
    if(isDigit) tagClass += ' topnum';
    else if(!VOWEL_LABELS.has(cell.standard.label)) tagClass += ' topright';
    tag.className = tagClass;
    tag.textContent = cell.standard.label;
    btn.appendChild(tag);
  }
  attachGlyphKey(btn, cell);
  return btn;
}

function buildRow(cells, trailing, letterStyle){
  const row = document.createElement('div');
  row.className = 'row';
  cells.forEach(cell => row.appendChild(makeKey(cell, letterStyle)));
  if(trailing) row.appendChild(trailing);
  return row;
}

function attachBackspaceBehavior(btn){
  let repeatTimer = null, startTimer = null;
  const stopRepeat = () => {
    clearTimeout(startTimer); clearInterval(repeatTimer);
    startTimer = null; repeatTimer = null;
    btn.classList.remove('pressed');
  };
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    btn.classList.add('pressed');
    backspace();
    startTimer = setTimeout(() => {
      repeatTimer = setInterval(backspace, 70);
    }, 380);
  });
  btn.addEventListener('pointerup', stopRepeat);
  btn.addEventListener('pointerleave', stopRepeat);
  btn.addEventListener('pointercancel', stopRepeat);
}

function makeBackspace(){
  const btn = document.createElement('button');
  btn.className = 'key special';
  const span = document.createElement('span'); span.className = 'label-txt';
  span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H6"></path><path d="M10 6l-6 6 6 6"></path></svg>';
  btn.appendChild(span);
  attachBackspaceBehavior(btn);
  return btn;
}

/* ---------- Harfler sayfası: Sayı sırası + Satır B, C(virgülsüz), D(noktasız)+⌫ ---------- */
const numberRow = KEYMAP.rows.A.slice(1, 11); // 1-9,0 (Tırnak ve Tire hariç)
const rowC = KEYMAP.rows.C.slice(0, -1);   // son eleman: Virgül -> ayrı tuşa taşındı
const commaCell = KEYMAP.rows.C[KEYMAP.rows.C.length - 1];
commaCell.extraAlts = [
  { display: commaCell.shift.glyph, output: commaCell.shift.glyph },
  { display: '-', output: '-' },
  { display: commaCell.altgr.glyph, output: commaCell.altgr.glyph }
];
const tailCell = KEYMAP.rows.D[0];         // "<" tuşu -> alt sıraya taşındı
const rowD = KEYMAP.rows.D.slice(1, -1);   // ilk eleman "<", son eleman Nokta çıkarıldı

/* ---------- Tüm satırlarda tuşları sabit/eşit genişlikte hizala ---------- */
function equalizeKeyWidths(){
  // En kalabalık satır (Satır B, 12 tuş) referans genişliği belirler
  const refKey = rowBEl.querySelector('.key:not(.special)');
  if(!refKey) return;
  const w = refKey.getBoundingClientRect().width;
  document.querySelectorAll('.kbd-wrap .key:not(.special)').forEach(k => {
    k.style.flex = `0 0 ${w}px`;
  });
  // Satır D'nin sonundaki silme tuşu artık büyüyen tek eleman olduğu için
  // sınırsız genişlemesin diye sabit (orantılı) bir genişlik veriyoruz.
  const rowDBackspace = rowDEl.querySelector('.key.special');
  if(rowDBackspace) rowDBackspace.style.flex = `0 0 ${w * 1.1}px`;
  const enterBtnEl = document.getElementById('enterBtn');
  if(rowDBackspace && enterBtnEl){
    const bRect = rowDBackspace.getBoundingClientRect();
    const enterRect = enterBtnEl.getBoundingClientRect();
    const newWidth = enterRect.right - bRect.left;
    if(newWidth > bRect.width) rowDBackspace.style.flex = `0 0 ${newWidth}px`;
  }
  // "123" sayfasındaki silme tuşu artık matematik kutusunun bir hücresi, ayrı boyutlandırma gerekmiyor

  // Koyu yeşil sayı tuşları (Satır A, 11 tuş) beyaz tuşlardan (Satır B, 12 tuş)
  // daha az rakip paylaştığı için biraz daha geniş olabilir.
  const gap = 3;
  const available = w * 12 + gap * 11;
  const darkW = (available - gap * 9) / 10;
  document.querySelectorAll('.kbd-wrap .key.letter:not(.special)').forEach(k => {
    k.style.flex = `0 0 ${darkW}px`;
  });
}

  '1': [{ display: '1.', output: '1.' }, { display: "1'er", output: "1'er" }],
  '2': [{ display: '2.', output: '2.' }, { display: "2'şer", output: "2'şer" }],

};

function makePlainCharKey(ch, dark, trackCaps){
  const btn = document.createElement('button');
  btn.className = 'key' + (dark ? ' letter' : '');
  const span = document.createElement('span');
  span.className = 'glyph plain';
  span.style.fontFamily = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
  span.style.transform = 'translate(-50%, -50%)';
  btn.appendChild(span);
  if(trackCaps){
    const lower = ch.toLocaleLowerCase('tr-TR');
    span.textContent = lower;
    trLetterKeys.push({ span, upper: ch, lower });
    const circLower = TR_CIRCUMFLEX[ch];
    if(circLower){
      attachCustomPopupKey(
        btn,
        () => [{ display: trCapsOn ? circLower.toLocaleUpperCase('tr-TR') : circLower, output: trCapsOn ? circLower.toLocaleUpperCase('tr-TR') : circLower }],
        () => trCapsOn ? ch : lower,
        { fontSize: '19px' }
      );
    } else {
      attachTap(btn, () => commit(trCapsOn ? ch : lower, true));
    }
  } else {
    span.textContent = ch;
    const digitOpts = TR_DIGIT_POPUPS[ch];
    if(digitOpts){
      attachCustomPopupKey(btn, () => digitOpts, ch, { numbered: true, forceBelow: true, fontSize: '15px' });
    } else {
      attachTap(btn, () => commit(ch, true));
    }
  }
  return btn;
}
function buildPlainRow(chars, trailing, dark, trackCaps){
  const row = document.createElement('div');
  row.className = 'row';
  chars.forEach(ch => row.appendChild(makePlainCharKey(ch, dark, trackCaps)));
  if(trailing) row.appendChild(trailing);
  return row;
}

/* ---------- Boşluk tuşu: dokunma = boşluk, kaydırma = Tengwar/İngilizce geçişi ---------- */
function attachSpaceKey(el, toEnglish){
  let startX = null, swiped = false, holdTimer = null, repeatTimer = null, repeating = false;
  const THRESHOLD = 40;
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); startX = e.clientX; swiped = false; repeating = false; el.classList.add('pressed');
    try { el.setPointerCapture(e.pointerId); } catch(err){ /* bazı tarayıcılarda gerekmeyebilir */ }
    holdTimer = setTimeout(() => {
      if(!swiped){
        repeating = true;
        commit(' ');
        repeatTimer = setInterval(() => { if(!swiped) commit(' '); }, 70);
      }
    }, 380);
  });
  el.addEventListener('pointermove', (e) => {
    if(startX === null) return;
    if(Math.abs(e.clientX - startX) > THRESHOLD) swiped = true;
  });
  const finish = () => {
    el.classList.remove('pressed');
    clearTimeout(holdTimer); clearInterval(repeatTimer);
    holdTimer = null; repeatTimer = null;
  };
  el.addEventListener('pointerup', () => {
    finish();
    if(swiped){
      showPage(toEnglish ? pageEnglish : pageLetters);
    } else if(!repeating){
      commit(' ');
    }
    startX = null; repeating = false;
  });
  el.addEventListener('pointercancel', finish);
}
function addSpaceArrows(el){
  const left = document.createElement('span');
  left.className = 'space-arrow left';
  left.textContent = '‹';
  const right = document.createElement('span');
  right.className = 'space-arrow right';
  right.textContent = '›';
  el.appendChild(left);
  el.appendChild(right);
}

}
